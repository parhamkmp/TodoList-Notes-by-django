{% extends 'base.html' %}

{% load crispy_forms_tags %}

{% load static %}

{% block title %}
	Create account
{% endblock title %}




{% block content %}

<body style="background-size: cover;background-image: url('{% static "img/login.jpg" %}');">
	
</body>



<div class="col-lg-7 col-10 " style="
  margin-left: auto;
  margin-right: auto;
 ">
   <div class="mt-3 text-light mb-3 login_to_show" style="
		 background: rgba(255, 255, 255, 0.1);
	  backdrop-filter: blur(12px);
	  -webkit-backdrop-filter: blur(12px);
	  color: #fff;
	  padding: 20px;
	  border-radius: 8px;
	">
        <h1>Create account</h1>
        <hr>
        <form action="" method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <a href="{% url 'login' %}" class="text-light">Do you have account? click here</a><br><br>
            <a href="{% url 'home_page' %}" class="text-light"><i class="fa fa-undo"></i> Back to home</a><br><br>
            <button type="submit" class="btn btn-primary col-lg-3 col-12 col-md-4 mt-3">Create account</button>
        </form>
    </div>
</div>



{% endblock content %}
